<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">

  <!-- Basic Icons -->
  <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
  <!-- Filled Icons -->
  <link href="https://cdn.boxicons.com/3.0.8/fonts/filled/boxicons-filled.min.css" rel="stylesheet">
  <!-- Brand Icons -->
  <link href="https://cdn.boxicons.com/3.0.8/fonts/brands/boxicons-brands.min.css" rel="stylesheet">

  <title>AdminHub</title>
</head>
<body>
  <!-- SIDEBAR -->
  <section id="sidebar">
    <a href="#" class="brand">
      <i class="bxf bx-smile"></i>
      <span class="text">AdminHub</span>
    </a>
    <ul class="side-menu top">
      <li class="active">
        <a href="#">
          <i class="bxf bx-dashboard"></i>
          <span class="text">Dashboard</span>
        </a>
      </li>
      <li>
        <a href="#">
          <i class="bxf bx-shopping-bag-alt"></i>
          <span class="text">My Store</span>
        </a>
      </li>
      <li>
        <a href="#">
          <i class="bxf bx-doughnut-chart"></i>
          <span class="text">Analytics</span>
        </a>
      </li>
      <li>
        <a href="#">
          <i class="bxf bx-message-dots-2"></i>
          <span class="text">Messages</span>
        </a>
      </li>
      <li>
        <a href="#">
          <i class="bxf bx-group"></i>
          <span class="text">Team</span>
        </a>
      </li>
    </ul>
    <ul class="side-menu">
      <li>
        <a href="#">
          <i class="bxf bx-cog"></i>
          <span class="text">Settings</span>
        </a>
      </li>
      <li>
        <a href="#" class="logout">
          <i class="bxf bx-arrow-out-left-square-half"></i>
          <span class="text">Logout</span>
        </a>
      </li>
    </ul>
  </section>
  <!-- SIDEBAR -->



  <!-- CONTENT -->
   <section id="content">
      <!-- NAVBAR -->
      <nav>
        <i class="bxf bx-menu"></i>
        <a href="#" class="nav-link">Categories</a>
        <form action="#">
          <div class="form-input">
            <input type="search" placeholder="Search...">
            <button type="submit" class="search-btn"><i class="bxf bx-search"></i></button>
          </div>
        </form>
        <a href="#" class="notification">
          <i class="bxf bx-bell"></i>
          <span class="num">8</span>
        </a>
        <a href="#" class="profile">
          <img src="img/people.png" alt="">
        </a>
      </nav>
      <!-- NAVBAR -->
   </section>


  <script src="script.js"></script>
</body>
</html>
